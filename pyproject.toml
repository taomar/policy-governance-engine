[project]
name = "policy-platform"
version = "0.1.0"
description = "Enterprise Policy Formalization and Deterministic Policy Platform (local build)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<2.1",
  "asyncpg>=0.29,<0.30",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.13,<2.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27,<0.28",
  "pdfplumber>=0.11,<0.12",
  "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<0.25",
  "httpx>=0.27,<0.28",
]
# Docling-based document conversion and graph discovery. Deliberately optional:
# `docling` resolves to `docling-slim[standard]`, which pulls torch,
# torchvision, accelerate and scipy. The API runtime image (see Dockerfile)
# must not carry that footprint, so extraction runs in an environment that
# installs this extra explicitly. Versions are pinned exactly — see
# infrastructure/docling/dependency_provenance.py for why a range is not
# acceptable here.
graph = [
  "docling-graph==1.9.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
